[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^2.0.0

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^2.0.0

; --------------------------------------------------------------------------
; Native (SDL) emulator targets — render the firmware UI in a desktop window
; with no ESP32 hardware. M5GFX provides the LovyanGFX SDL backend; a faithful
; M5Unified-shaped shim in support/native/include/ + support/native/*.cpp
; supplies the rest (buttons → keyboard, IMU/Power/RTC fakes, BLE no-ops).
;
; src/hal/*.cpp compiles unchanged; only ble_bridge.cpp is filtered out (the
; NimBLE library doesn't build on host).
;
; Run headlessly with screenshot capture:
;   SCREENSHOT_FILE=/tmp/stickc.ppm SCREENSHOT_AT_MS=2000 EXIT_AFTER_MS=3000 \
;     xvfb-run -a -s "-screen 0 800x600x24" pio run -e emulator_stickc -t exec
;   convert /tmp/stickc.ppm /tmp/stickc.png
;
; Keyboard:  A/Left = BtnA, B/Right = BtnB, P = power-button (AXP).
; --------------------------------------------------------------------------

[env:emulator_common]
platform = native@^1.2.1
extra_scripts = support/native/sdl2_build_extra.py
build_type = debug
build_flags =
    -std=gnu++17
    -I support/native/include
    -include Arduino.h
    -D NATIVE_BUILD
    -D CORE_DEBUG_LEVEL=0
    -D M5GFX_SHOW_FRAME
    -D M5GFX_BACK_COLOR=0x222222U
    -D M5GFX_SCALE=2
    -D M5GFX_ROTATION=0
    -l SDL2
lib_deps =
    https://github.com/m5stack/M5GFX.git#develop
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
lib_archive = false
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter =
    +<*>
    +<buddies/>
    +<../support/native/>
    -<ble_bridge.cpp>

[env:emulator_stickc]
extends = env:emulator_common
build_flags =
    ${env:emulator_common.build_flags}
    -D M5GFX_BOARD=board_M5StickCPlus
    -D NATIVE_TARGET_STICKC

[env:emulator_core2]
extends = env:emulator_common
build_flags =
    ${env:emulator_common.build_flags}
    -D M5GFX_BOARD=board_M5StackCore2
    -D NATIVE_TARGET_CORE2
    -D BOARD_HAS_PSRAM
