# Builds emulator + firmware, captures every screen layout, and publishes
# the docs/ folder (including firmware binaries + ESP Web Tools manifests)
# to GitHub Pages on every push. Also updates the "latest" GitHub Release
# with the firmware binaries so users can download them directly.
#
# To enable: repo Settings → Pages → Source: "GitHub Actions".
name: Build, capture, publish

on:
  push:
    branches:
      - main
      - hal-refactor
      - 'claude/**'
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'support/native/**'
      - 'docs/**'
      - 'bridge/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write     # write needed for the "latest" release update
  pages: write
  id-token: write

# Don't queue overlapping deploys — last push wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bridge:
    # Runs the bridge's pytest suite. Keeps the OTA / NUS protocol
    # contract honest as both ends evolve — if the device adds a new cmd
    # or evt shape and bridge's protocol.py doesn't follow, this job
    # fails first. Runs in parallel with the firmware build below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          manifest-path: bridge/pixi.toml
          cache: true

      - name: pytest
        run: cd bridge && pixi run pytest -q

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev xvfb imagemagick

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Cache PIO library deps
        uses: actions/cache@v4
        with:
          path: .pio/libdeps
          key: pio-libdeps-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-libdeps-${{ runner.os }}-

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Build emulator binaries
        run: pio run -e emulator_stickc -e emulator_core2

      - name: Capture screen layouts
        run: support/native/capture_screens.sh

      - name: Sanity-check captures
        run: |
          n=$(ls docs/emulator/screenshots/*.png | wc -l)
          echo "Found $n PNGs"
          if [ "$n" -lt 26 ]; then
            echo "::error::Expected at least 26 captures, got $n"
            exit 1
          fi

      - name: Build firmware
        # CLAUDE_BUILD_VERSION baked into the binary via -D so the device
        # can report what it's running over BLE (evt:info on connect).
        # Format: branch@short-sha, e.g. "hal-refactor@a1b2c3d".
        run: |
          export PLATFORMIO_BUILD_FLAGS="-DCLAUDE_BUILD_VERSION=\\\"${GITHUB_REF_NAME}@${GITHUB_SHA::7}\\\""
          pio run -e m5stickc-plus -e m5stack-core2

      - name: Stage firmware binaries + ESP Web Tools manifests
        run: |
          # Standard ESP32 flash offsets (no_ota partition table):
          #   bootloader  → 0x1000
          #   partitions  → 0x8000
          #   firmware    → 0x10000
          # ESP Web Tools' install button reads parts/path/offset from
          # manifest.json relative to the manifest's URL.
          sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME}"
          version="${branch}@${sha}"
          for env in m5stickc-plus m5stack-core2; do
            dst="docs/firmware/${env}"
            mkdir -p "$dst"
            cp ".pio/build/${env}/firmware.bin"   "$dst/firmware.bin"
            cp ".pio/build/${env}/bootloader.bin" "$dst/bootloader.bin"
            cp ".pio/build/${env}/partitions.bin" "$dst/partitions.bin"
            cat > "$dst/manifest.json" <<EOF
          {
            "name": "claude-desktop-buddy — ${env}",
            "version": "${version}",
            "home_assistant_domain": "claude_buddy",
            "funding_url": "https://github.com/onetxpanda/claude-desktop-buddy",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "bootloader.bin", "offset": 4096 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "firmware.bin",   "offset": 65536 }
                ]
              }
            ]
          }
          EOF
            ls -la "$dst"
          done

      - name: Stamp build info into the site
        run: |
          sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME}"
          when="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s|<p id=\"meta\"></p>|<p id=\"meta\">Built from <code>${branch}@${sha}</code> at ${when}.</p>|" docs/index.html

      - name: Stage site for Pages
        run: |
          mkdir -p _site
          cp -r docs/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Stage release assets with board-prefixed names
        run: |
          # softprops/action-gh-release@v2 uploads by basename, so two
          # "firmware.bin" files collide on the release. Flatten with a
          # board prefix so each asset has a unique name.
          mkdir -p _release
          for env in m5stickc-plus m5stack-core2; do
            for f in bootloader.bin partitions.bin firmware.bin manifest.json; do
              cp "docs/firmware/${env}/${f}" "_release/${env}-${f}"
            done
          done
          ls -la _release

      - name: Update "latest" GitHub Release with firmware binaries
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (${{ github.ref_name }})"
          prerelease: true
          # Move the "latest" tag to the current commit on every release.
          target_commitish: ${{ github.sha }}
          body: |
            Auto-built from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            Flash via the [Pages installer](https://onetxpanda.github.io/claude-desktop-buddy/)
            (Chrome/Edge desktop with WebUSB) or with `esptool.py` /
            `pio run -e <env> -t upload`.

            Standard ESP32 flash offsets (no_ota partition table):

            | file | offset |
            |---|---|
            | `<board>-bootloader.bin` | `0x1000` |
            | `<board>-partitions.bin` | `0x8000` |
            | `<board>-firmware.bin`   | `0x10000` |

            `<board>` is one of `m5stickc-plus`, `m5stack-core2`.
          files: |
            _release/m5stickc-plus-bootloader.bin
            _release/m5stickc-plus-partitions.bin
            _release/m5stickc-plus-firmware.bin
            _release/m5stickc-plus-manifest.json
            _release/m5stack-core2-bootloader.bin
            _release/m5stack-core2-partitions.bin
            _release/m5stack-core2-firmware.bin
            _release/m5stack-core2-manifest.json

  deploy-pages:
    # Pages deploy waits on both jobs — bridge tests must pass before we
    # publish a site that documents/distributes a firmware that may have
    # broken the protocol contract.
    needs: [build, bridge]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
