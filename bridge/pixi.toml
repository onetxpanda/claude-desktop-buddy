[workspace]
name = "claude-buddy-bridge"
version = "0.1.0"
description = "BLE buddy device bridge for Claude Code CLI"
authors = ["Stephen Oliver <stephenoliver@apptronik.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11,<3.13"
pip = "*"

[pypi-dependencies]
claude-buddy-bridge = { path = ".", editable = true }
bleak = ">=0.22"

[feature.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5"
ruff = ">=0.6"
pyright = ">=1.1"

[environments]
default = { features = ["dev"] }

[tasks]
test = "pytest -q"
test-cov = "pytest --cov=claude_buddy_bridge --cov-report=term-missing"
lint = "ruff check src tests"
fmt = "ruff format src tests"
typecheck = "pyright src"
check = { depends-on = ["lint", "typecheck", "test"] }
