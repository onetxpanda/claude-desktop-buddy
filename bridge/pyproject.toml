[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-buddy-bridge"
version = "0.1.0"
description = "BLE buddy device bridge for Claude Code CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Stephen Oliver", email = "stephenoliver@apptronik.com" }]
dependencies = ["bleak>=0.22"]

[project.scripts]
claude-buddy = "claude_buddy_bridge.cli:main"
claude-buddy-hook = "claude_buddy_bridge.hook:main"
claude-buddy-bridge = "claude_buddy_bridge.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_buddy_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # asyncio can leave sockets unclosed when a connection attempt is cancelled;
    # the warning fires during GC, not during the test itself.
    "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
